<!doctype html><html lang="zh"><meta charset="utf-8"><title>博客内容管理</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;background:#f7f8fa}textarea{width:100%;height:420px}button,select,input{padding:10px;margin:5px}pre{white-space:pre-wrap}</style><h1>博客内容管理</h1><p>使用管理员账号登录。data 保留原有前端 DTO 格式；发布前请确认正文与链接。</p><select id="kind"><option>posts</option><option>projects</option><option>settings</option></select><button id="load">加载</button><select id="entries"></select><button id="edit">编辑所选</button><button id="new">新建</button><textarea id="editor"></textarea><button id="save">保存</button><button id="delete">删除</button><pre id="status"></pre><script>
let rows=[],slug=null;const $=id=>document.getElementById(id);async function request(path,method='GET',body){let headers={};if(method!=='GET'){const c=await fetch('/api/csrf').then(r=>r.json());headers[c.headerName]=c.token;headers['Content-Type']='application/json'}const r=await fetch('/api/'+path,{method,headers,body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(r.status+' '+await r.text());return r.status===204?null:r.json()}
async function load(){rows=await request('admin/'+$('kind').value);$('entries').replaceChildren(...rows.map(r=>{let o=document.createElement('option');o.value=r.slug;o.textContent=r.title+(r.published?'（已发布）':'（草稿）');return o}))}
function edit(){let r=rows.find(r=>r.slug===$('entries').value);if(!r)return;slug=r.slug;$('editor').value=JSON.stringify({slug:r.slug,title:r.title,published:r.published,version:r.version,data:JSON.parse(r.body)},null,2)}
for(const [id,fn]of Object.entries({load,edit,new:()=>{slug=null;$('editor').value=JSON.stringify({slug:'new-post',title:'新文章',published:false,data:{category:'go',tags:[],excerpt:'',content:null,headings:[]}},null,2)},save:async()=>{await request('admin/'+$('kind').value+(slug?'/'+encodeURIComponent(slug):''),slug?'PUT':'POST',JSON.parse($('editor').value));await load();$('status').textContent='保存成功；重新选择后编辑可加载最新版本'},delete:async()=>{if(!slug||!confirm('确认删除？'))return;await request('admin/'+$('kind').value+'/'+encodeURIComponent(slug)+'?version='+JSON.parse($('editor').value).version,'DELETE');await load()}}))$(id).onclick=()=>Promise.resolve().then(fn).catch(e=>$('status').textContent=e.message);
$('kind').onchange=()=>{slug=null;$('editor').value='';load().catch(e=>$('status').textContent=e.message)};load().catch(e=>$('status').textContent=e.message);
</script></html>
